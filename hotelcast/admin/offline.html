<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Offline</title>
<style>
  html,body{height:100%;margin:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Gujarati",sans-serif;background:#f5f3f8;color:#222;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
  .box{max-width:420px;text-align:center;background:#fff;border-radius:16px;padding:32px 24px;box-shadow:0 6px 24px rgba(0,0,0,.08)}
  .icon{font-size:48px;line-height:1}
  h1{font-size:1.4rem;margin:16px 0 8px}
  p{margin:6px 0;color:#555}
  button{margin-top:20px;font-size:1rem;padding:10px 24px;border:0;border-radius:8px;background:#7B1FA2;color:#fff;cursor:pointer}
</style>
</head>
<body>
<div class="box">
  <div class="icon" aria-hidden="true">📶</div>
  <h1>You are offline</h1>
  <p>Check the internet connection of this phone or PC and try again.</p>
  <p lang="gu">તમે ઑફલાઇન છો. ઇન્ટરનેટ કનેક્શન તપાસો અને ફરી પ્રયત્ન કરો.</p>
  <button type="button" onclick="location.reload()">Try again / ફરી પ્રયત્ન કરો</button>
</div>
</body>
</html>
