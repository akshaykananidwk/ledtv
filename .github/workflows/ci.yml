name: CI

on:
  push:
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hotelcast_test
          MYSQL_USER: hctest
          MYSQL_PASSWORD: hctest_pw_123
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_mysql, mysqli, curl, zip, gd, mbstring, sodium, fileinfo, intl
          tools: phpunit:11
      - name: Grant installer test privileges
        run: mysql -h127.0.0.1 -uroot -proot -e "GRANT ALL ON \`hotelcast_inst%\`.* TO 'hctest'@'%'; GRANT CREATE ON *.* TO 'hctest'@'%'; FLUSH PRIVILEGES;"
      - name: Lint
        run: find hotelcast -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: PHPUnit
        working-directory: hotelcast
        env:
          HC_TEST_DB_HOST: 127.0.0.1
        run: phpunit -c phpunit.xml

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Restore signing key (optional, from repository secrets)
        env:
          KS_B64: ${{ secrets.HOTELCAST_KEYSTORE_BASE64 }}
        if: ${{ env.KS_B64 != '' }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "HOTELCAST_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Unit tests + release build
        env:
          HOTELCAST_KEYSTORE_PASSWORD: ${{ secrets.HOTELCAST_KEYSTORE_PASSWORD }}
          HOTELCAST_KEY_ALIAS: ${{ secrets.HOTELCAST_KEY_ALIAS }}
          HOTELCAST_KEY_PASSWORD: ${{ secrets.HOTELCAST_KEY_PASSWORD }}
        working-directory: android
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: hotelcast-tv-apk
          path: android/app/build/outputs/apk/release/*.apk
